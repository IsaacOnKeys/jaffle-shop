version: 2

models:
  - name: stg_stripe__payment
    description: Standardized Stripe payment records with renamed fields and normalized payment attributes for downstream order and customer reporting.
    columns:
      - name: payment_id
        description: Primary key for each payment record from Stripe.
        tests:
          - unique
          - not_null

      - name: order_id
        description: Foreign key to the order associated with the payment.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__orders')
                field: order_id

      - name: payment_method
        description: Payment method used for the transaction.
        tests:
          - not_null

      - name: payment_status
        description: Status of the payment in Stripe.
        tests:
          - not_null

      - name: payment_amount
        description: Payment amount recorded for the transaction.
        tests:
          - not_null

      - name: payment_created
        description: Timestamp when the payment record was created in Stripe.
        tests:
          - not_null

      - name: payment__batched_at
        description: Timestamp when the payment record was loaded from the source system.